spring:
  application:
    name: room-service
  profiles:
    active: local
  liquibase:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelter}
    username: ${DB_USERNAME:shelter}
    password: ${DB_PASSWORD:shelter}

server:
  port: 8083

gateway:
  auth:
    secret: ${JWT_SECRET}
