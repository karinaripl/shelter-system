spring:
  application:
    name: auth-service
  profiles:
    active: local
  liquibase:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelter}
    username: ${DB_USERNAME:shelter}
    password: ${DB_PASSWORD:shelter}
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
