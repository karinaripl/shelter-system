spring:
  application:
    name: booking-service
  profiles:
    active: local
  liquibase:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelter}
    username: ${DB_USERNAME:shelter}
    password: ${DB_PASSWORD:shelter}

server:
  port: 8081

gateway:
  auth:
    secret: ${JWT_SECRET}

room-service:
  url: ${ROOM_SERVICE_URL:http://localhost:8083}

notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
