spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Публичные маршруты. Пути /internal/** сюда намеренно не попадают:
          # они предназначены только для вызовов между сервисами.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/auth/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/bookings/**,/booking/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/notification/**
            - id: room-service
              uri: ${ROOM_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/rooms/**,/room/**

server:
  port: 8765

jwt:
  secret: ${JWT_SECRET}
