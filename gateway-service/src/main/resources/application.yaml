spring:
  application:
    name: gateway-service
  config:
    # Подхватываем .env из корня проекта (работает и при запуске из корня, и из папки модуля)
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          # Публичные маршруты. Пути /internal/** сюда намеренно не попадают:
          # они предназначены только для вызовов между сервисами.
          routes:
            # Админ-панель (/admin/**) разнесена по сервисам; шлюз пропускает её только с ролью ADMIN
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8180}
              predicates:
                - Path=/auth/**,/admin/users/**,/admin/roles/**
            - id: shelter-core-service
              uri: ${SHELTER_CORE_SERVICE_URL:http://localhost:8184}
              predicates:
                - Path=/animals/**,/cages/**,/animal-statuses/**,/arrival-sources/**,/public/**,/admin/employees/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8181}
              predicates:
                - Path=/bookings/**,/booking/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8182}
              predicates:
                - Path=/notification/**
            - id: room-service
              uri: ${ROOM_SERVICE_URL:http://localhost:8183}
              predicates:
                - Path=/rooms/**,/room/**

server:
  port: 8766

jwt:
  secret: ${JWT_SECRET}
